<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your Sway account."
    >

    <title>Create Account — Sway</title>

    <link
        rel="stylesheet"
        href="../css/design-system.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body class="auth-page">

    <main class="auth-container">

        <!-- ========================================
             BRAND
             ======================================== -->

        <a
            href="../index.html"
            class="auth-brand"
            aria-label="Sway home"
        >

            <span class="brand-mark">
                S
            </span>

            <span class="auth-brand-name">
                Sway
            </span>

        </a>


        <!-- ========================================
             REGISTER CARD
             ======================================== -->

        <section class="auth-card">

            <div class="auth-header">

                <h1>
                    Create your account
                </h1>

                <p>
                    Join Sway and start sharing.
                </p>

            </div>


            <!-- ====================================
                 ALERT
                 ==================================== -->

            <div
                class="auth-alert"
                id="auth-alert"
                role="alert"
                aria-live="polite"
                hidden
            ></div>


            <!-- ====================================
                 REGISTER FORM
                 ==================================== -->

            <form
                id="register-form"
                class="auth-form"
                novalidate
            >

                <!-- NAME -->

                <div class="form-group">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Full name
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="user"
                            class="input-icon"
                        ></i>

                        <input
                            id="name"
                            name="name"
                            type="text"
                            class="form-input"
                            placeholder="Your name"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label
                        for="username"
                        class="form-label"
                    >
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="at-sign"
                            class="input-icon"
                        ></i>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            class="form-input"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="mail"
                            class="input-icon"
                        ></i>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            class="form-input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="lock"
                            class="input-icon"
                        ></i>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-input password-input"
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Show password"
                        >

                            <i data-lucide="eye"></i>

                        </button>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="register-submit"
                >

                    <span class="button-text">
                        Create Account
                    </span>

                    <span
                        class="button-loading"
                        hidden
                    >
                        Creating account...
                    </span>

                </button>

            </form>


            <!-- ====================================
                 LOGIN LINK
                 ==================================== -->

            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a
                    href="./login.html"
                    class="auth-link"
                >
                    Sign in
                </a>

            </div>

        </section>


        <!-- ========================================
             LEGAL
             ======================================== -->

        <p class="auth-legal">

            By creating an account, you agree to
            Sway's
            <a href="#">
                Terms
            </a>
            and
            <a href="#">
                Privacy Policy
            </a>.

        </p>

    </main>


    <!-- Lucide -->
    <script
        src="https://unpkg.com/lucide@latest"
    ></script>

    <!-- Auth JS -->
    <script src="../js/auth.js"></script>

</body>

</html>
