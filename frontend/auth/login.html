<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in to Sway."
    >

    <title>Sign In — Sway</title>

    <!-- Existing design system -->
    <link
        rel="stylesheet"
        href="../css/design-system.css"
    >

    <!-- Auth styles -->
    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body class="auth-page">

    <main class="auth-container">

        <!-- ========================================
             BRAND
             ======================================== -->

        <a
            href="../index.html"
            class="auth-brand"
            aria-label="Sway home"
        >

            <span class="brand-mark">
                S
            </span>

            <span class="auth-brand-name">
                Sway
            </span>

        </a>


        <!-- ========================================
             LOGIN CARD
             ======================================== -->

        <section class="auth-card">

            <div class="auth-header">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to continue to Sway.
                </p>

            </div>


            <!-- ====================================
                 ERROR MESSAGE
                 ==================================== -->

            <div
                class="auth-alert"
                id="auth-alert"
                role="alert"
                aria-live="polite"
                hidden
            ></div>


            <!-- ====================================
                 LOGIN FORM
                 ==================================== -->

            <form
                id="login-form"
                class="auth-form"
                novalidate
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="mail"
                            class="input-icon"
                        ></i>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            class="form-input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="form-label-row">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <a
                            href="#"
                            class="forgot-link"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <div class="input-wrapper">

                        <i
                            data-lucide="lock"
                            class="input-icon"
                        ></i>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-input password-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Show password"
                        >

                            <i
                                data-lucide="eye"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="login-submit"
                >

                    <span
                        class="button-text"
                    >
                        Sign In
                    </span>

                    <span
                        class="button-loading"
                        hidden
                    >
                        Signing in...
                    </span>

                </button>

            </form>


            <!-- ====================================
                 REGISTER LINK
                 ==================================== -->

            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a
                    href="./register.html"
                    class="auth-link"
                >
                    Create one
                </a>

            </div>

        </section>


        <!-- ========================================
             FOOTER
             ======================================== -->

        <p class="auth-legal">

            By continuing, you agree to Sway's
            <a href="#">
                Terms
            </a>
            and
            <a href="#">
                Privacy Policy
            </a>.

        </p>

    </main>


    <!-- Lucide -->
    <script
        src="https://unpkg.com/lucide@latest"
    ></script>

    <!-- Auth JS -->
    <script src="../js/auth.js"></script>

</body>

</html>
