<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile - Sway</title>

    <link
        rel="stylesheet"
        href="./css/design-system.css"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <header class="topbar">

        <div class="topbar-inner">

            <a
                href="./profile.html"
                class="brand"
            >
                Sway
            </a>

        </div>

    </header>


    <!-- ========================================= -->
    <!-- MAIN -->
    <!-- ========================================= -->

    <main class="page-container">

        <section class="card profile-edit-card">

            <!-- TITLE -->

            <div class="profile-edit-header">

                <h1>
                    Edit Profile
                </h1>

                <p>
                    Update your Sway profile information.
                </p>

            </div>


            <!-- ================================= -->
            <!-- FORM -->
            <!-- ================================= -->

            <form
                id="edit-profile-form"
            >

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        maxlength="50"
                        required
                    >

                </div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="username"
                        maxlength="30"
                        required
                    >

                </div>


                <!-- BIO -->

                <div class="form-group">

                    <label for="bio">
                        Bio
                    </label>

                    <textarea
                        id="bio"
                        name="bio"
                        placeholder="Tell people about yourself..."
                        maxlength="160"
                        rows="5"
                    ></textarea>

                    <small>
                        Maximum 160 characters
                    </small>

                </div>


                <!-- AVATAR -->

                <div class="form-group">

                    <label for="avatar">
                        Avatar URL
                    </label>

                    <input
                        type="text"
                        id="avatar"
                        name="avatar"
                        placeholder="https://example.com/avatar.jpg"
                    >

                </div>


                <!-- BUTTONS -->

                <div class="profile-edit-actions">

                    <a
                        href="./profile.html"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        id="save-profile-button"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                </div>


                <!-- MESSAGE -->

                <div
                    id="profile-message"
                    class="profile-message"
                ></div>

            </form>

        </section>

    </main>


    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script src="./js/edit-profile.js"></script>

</body>

</html>
